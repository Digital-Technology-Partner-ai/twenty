worker_processes auto;

events {
  # HTTPS multiplexing can fan out many frontend asset requests at once.
  worker_connections 2048;
}

http {
  # The gateway can forward only to staging, never to an arbitrary destination.
  access_log off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  # Tailscale terminates HTTPS before reaching this loopback-only gateway.
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
  }
  server {
    listen 8080;
    client_max_body_size 50m;
    location / {
      proxy_pass http://server:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }
}
